name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  otp: ^3.2.1
  intl: ^0.20.3
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  url_launcher: ^6.3.3
  lucide_icons_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_ppm.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo_ppm.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/